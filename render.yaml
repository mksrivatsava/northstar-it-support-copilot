services:
  - type: web
    name: northstar-it-support-copilot
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PUBLIC_DEPLOYMENT
        value: "true"
      - key: PERSISTENCE_BACKEND
        value: postgres
      - key: POSTGRES_SCHEMA
        value: northstar
      - key: ENABLE_RETAIL_API
        value: "false"
      - key: ANSWER_MODE
        value: gemini
      - key: RETRIEVAL_MODE
        value: pinecone
      - key: WEB_SEARCH_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: APP_ADMIN_KEY
        generateValue: true
